; Per pm-assets/docs/custom-assets-recipe.md: project and shader library named after the mod (plugin id, - as _),
; IoStore, shared shader code, everything under /Game/Mods/elemental_balls/. /Game/Preview and /Game/SourceArt are
; editor-only (preview scene, volume texture sources) and never cooked.
[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=elemental_balls

[/Script/UnrealEd.ProjectPackagingSettings]
UsePakFile=True
bUseIoStore=True
bShareMaterialShaderCode=True
+DirectoriesToAlwaysCook=(Path="/Game/Mods")
+DirectoriesToNeverCook=(Path="/Game/Preview")
